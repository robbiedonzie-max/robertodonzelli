# Configurazione Sveltia CMS — pannello admin di Places
# base_url deve combaciare con l'Authorization callback URL della GitHub OAuth App.

backend:
  name: github
  repo: robbiedonzie-max/robertodonzelli
  branch: main
  base_url: https://www.robertodonzelli.it
  auth_endpoint: api/auth

# Le foto caricate vengono salvate qui nel repo...
media_folder: places/photos
# ...e nei dati vengono referenziate con questo percorso assoluto (il sito sta in /places).
public_folder: /places/photos

site_url: https://www.robertodonzelli.it/places
locale: it

collections:
  - name: luoghi
    label: Luoghi
    files:
      - name: elenco
        label: Elenco dei luoghi
        file: places/data/places.json
        description: 'Aggiungi un luogo con "Aggiungi Luoghi". Le foto più recenti in cima.'
        fields:
          - name: luoghi
            label: Luoghi
            label_singular: Luogo
            widget: list
            summary: '{{fields.where}} — {{fields.date}}'
            fields:
              - name: photos
                label: Foto
                widget: list
                label_singular: Foto
                summary: 'foto (chiara + scura)'
                hint: 'Per ogni foto carica la versione chiara (sfondo bianco) e la scura (sfondo nero). Più foto = si scorrono con lo swipe.'
                fields:
                  - { name: light, label: Versione chiara (sfondo bianco), widget: image, required: false }
                  - { name: dark, label: Versione scura (sfondo nero), widget: image, required: false }
              - { name: where, label: Luogo, widget: string, required: false, hint: 'Es. Duomo, Milano — da qui vengono calcolate le coordinate' }
              - name: lat
                label: Latitudine
                widget: number
                value_type: float
                required: false
                hint: 'Lascia vuoto: si compila da solo dalla località dopo il salvataggio (puoi comunque correggerlo)'
              - name: lng
                label: Longitudine
                widget: number
                value_type: float
                required: false
                hint: 'Lascia vuoto: si compila da solo dalla località dopo il salvataggio'
              - name: people
                label: Persone
                widget: list
                required: false
                field: { name: nome, label: Nome, widget: string }
              - name: date
                label: Data
                widget: datetime
                format: 'YYYY-MM-DD'
                date_format: 'DD/MM/YYYY'
                time_format: false
                required: false
                hint: 'Ordina la griglia: le più recenti a sinistra'
